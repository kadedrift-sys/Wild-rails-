function update(dt){

 const play=st==='play';let mv=0;

  for(const o of obs){

   o.m.position.z=o.z}
  {const tr=obs.filter(o=>o.ty==='train'&&!o.gone&&!o.fly&&!o.ride).sort((p,q)=>q.z-p.z);for(let i=0;i<tr.length;i++)for(let j=i+1;j<tr.length;j++){const p=tr[i],q=tr[j];if(p.x!==q.x)continue;const lim=p.z-p.len/2-q.len/2-.6;if(q.z>lim){q.z=lim;q.vz=p.vz||0;q.m.position.z=lim}}}
  if(blk){if(blk===2&&inv<=0)crash();else{blocked=1;blockT=0}}else blocked=0;
  mom+=((blk?0:1)-mom)*Math.min(1,dt*(blk?20:1.1)); // momentum: drops fast on impact, builds back up gradually
  for(const c of coins){c.z+=mv;if(magnetT>0&&!c.got){const dx=px-c.x,dy=py+.9-c.y,dz=-c.z,d=Math.hypot(dx,dy,dz)||1;if(d<24){const m=Math.min(d,(26+speed)*dt);c.x+=dx/d*m;c.y+=dy/d*m;c.z+=dz/d*m}}c.m.position.set(c.x,c.y,c.z);c.m.rotation.z+=dt*5;if(!c.got&&Math.abs(c.x-px)<1&&Math.abs(c.z)<.9+mv*.5&&Math.abs(c.y-(py+.9))<1.1){c.got=1;coinsN++;save.coins++;dirty=1;burst(c.x,c.y,c.z,4,[0xffe27a,0xfff3b8],3,.35,.09,.6);scene.remove(c.m);beep(900+coinsN%8*50,.08,'triangle',.06)}}
  obs=obs.filter(o=>{if(o.dead){scene.remove(o.m);return false}if(o.z-o.len/2>12){scene.remove(o.m);return false}return true});if(rideLane!==null&&!ride&&!obs.some(o=>o.ride&&!o.gone)){rideLane=null;nextRide=dist+700}
  coins=coins.filter(c=>{if(c.got)return false;if(c.z>12){scene.remove(c.m);return false}return true});
  for(const b of pk){b.z+=mv;b.m.position.z=b.z;b.m.rotation.y+=dt*3;b.m.position.y=b.y+Math.sin(clk*4)*.12;if(b.got)continue;
   if(obs.some(o=>o.ty==='train'&&!o.fly&&o.x===b.x&&Math.abs(o.z-b.z)<o.len/2+.8)){b.got=1;scene.remove(b.m);continue}
   if(!ride&&Math.abs(b.x-px)<1.2&&Math.abs(b.z)<1.1+mv*.5&&Math.abs(b.y-(py+.9))<1.5){b.got=1;scene.remove(b.m);b.ty==='magnet'?getMagnet():getBoots()}}
  pk=pk.filter(b=>{if(b.got)return false;if(b.z>12){scene.remove(b.m);return false}return true});
 }else if(st==='menu'){mv=0;t+=dt;px+=(0-px)*.1}
 else if(st==='intro'){iT+=dt;px=0;const k=Math.max(0,Math.min(1,(iT-1.2)/.7));mv=14*k*k*dt;if(!iSay){iSay=1;toast('HEY! STOP RIGHT THERE!');beep(300,.25,'square',.08)}if(iT>=2.2)endIntro()}
 else crashT+=dt;
 // world scroll
 trackTex.offset.y+=mv/2.4;groundTex.offset.y+=mv/(320/24);
 for(const g of scen){g.position.z+=mv;if(g.position.z>16){g.position.z-=g.userData.back?136:132;g.position.x=g.userData.side*(g.userData.b+rnd()*1.5)}}
 for(const m of mesas){m.position.z+=mv*.9;if(m.position.z>24){m.position.z-=182;rollMesa(m)}}
 for(const h of spinners)h.rotation.z+=dt*1.6;

 for(const o of NPCS){o.g.position.z+=mv+(o.type==='walk'&&st!=='over'?o.vz*dt:0);if(o.g.position.z>16)npcPlace(o,o.g.position.z-(132+rnd()*8));npcAnim(o)}
 updLife(dt,mv);updDk(dt);rkS+=(((st==='play'&&dk&&(dk.st==='ride'||dk.st==='mount'))?1:0)-rkS)*Math.min(1,dt*16);

 // hero animation
 rph+=dt*(11+(play?speed*mom:14)*.18)*(.35+.65*mom);sph+=dt*(9+(play?speed*mom:14)*.15)*(heat>0?1.25:tiredT>0?.6:1);const ph=rph,dir=play?Math.max(-1.2,Math.min(1.2,pv/8)):0,air=py>fl+.03;
 const onRamp=play&&fl>.1&&fl<STH-.1&&py<=fl+.05;hero.position.set(px,py+rkS*.44+(dk&&dk.st==='mount'?Math.sin(Math.min(1,dk.t/.4)*Math.PI)*.6:0),st==='over'?-Math.max(0,.9-crashT*2):0);hero.rotation.set(0,-dir*.25,-dir*.18);if(st==='menu')hero.rotation.y=Math.PI+Math.sin(clk*.7)*.3;
 if(st==='intro')introHero();
 else if(st==='menu')lobbyHero();
 else if(st==='over'){const k=Math.min(1,crashT*3);downPose(H,k);hero.position.y=Math.abs(Math.sin(crashT*7))*.5*Math.exp(-crashT*2.5)}
 else if(ride)hangPose(H,clk);
 else if(rkS>.5)ridePose(H,rph,1);
 else if(onRamp)climbPose(H,rph);
 else if(slideT>0){wasRoll=1;slidePose(H,1-slideT/.65)}
 else if(air){if(window.RS==='bounce'){wasRoll=1;slidePose(H,Math.max(0,Math.min(1,(11-vy)/22)))}else airStyle(H,vy>0,window.RS)}
 else if(blocked)bumpPose(H,ph);
 else if(landT>0)landPose(H,landT/.2);
 else if(stumbleT>0)stumblePose(H,ph,stumbleT/.9);
 else STY(H,ph,dir,window.RS);

 // soldier chase
 const ct=ride?7:boostT>0?17:blocked?3:heat>0?3.6:tiredT>0?6:clean>7?18:4.6;chase+=(ct-chase)*Math.min(1,dt*(heat>0?5:tiredT>0?1.2:.5));const tz=chase+Math.sin(clk*2.2)*.25,ease=Math.min(1,introT/1.8);
 if(st==='over'){sz+=(1.25-sz)*Math.min(1,dt*6);sx+=(px-sx)*Math.min(1,dt*8)}
 else if(play){sz=1.2+(tz-1.2)*(ease*ease*(3-2*ease));sx+=(px+(heat>0?(px>0?-.9:.9):0)-sx)*Math.min(1,dt*(heat>0?6:3.5))}
 else if(st==='intro'){const k=Math.min(1,iT/1.8),e=k*k*(3-2*k);sz=8.5+(4.6-8.5)*e;sx=3.4*(1-e)}
 else{sz=tz;sx+=(px-sx)*.1}

 else if(play&&sherSt===3){sherT+=dt;const k=Math.min(1,sherT/.7);sz=sz0+(4.6-sz0)*k;sy=.12*(1-k)+Math.sin(k*Math.PI)*1.1;if(k>=1){sherSt=0;chase=4.6}}
 if(play&&sherSt===4){sdz=Math.max(7,sdz-(sdz>9?18:6)*dt);sz=sdz+Math.sin(clk*2.2)*.2} // sheriff gallops in right behind you
 if(sherSt===2||sherSt===4){sy=.12;sdp.x=sx;sdp.z=sz}else if(sdRun&&play){sdp.z-=11*dt;sdp.x+=sdp.vx*dt;if(sdp.z<-45){sdRun=0;SD.g.visible=false}}
 if(SD.g.visible&&(sherSt===2||sherSt===4||sdRun)){SD.g.position.set(sdp.x,Math.pow(Math.sin(clk*12),2)*.1,sdp.z);gallop(SD,clk*12,1)}
 const sf=play?floorAtP(sx,sz,9):0;sYs+=(sf-sYs)*Math.min(1,dt*(sf>sYs?10:7));if(!play)sYs*=.9;
 const sd2=(px-sx)/LW;let hop=0,hopUp=0; // he hops the crates you jumped over
 if(play)for(const o of obs)if(o.ty==='crate'&&Math.abs(o.x-sx)<1.3){const d=o.z-sz;if(Math.abs(d)<1.5){const h=1.25*(1-d*d/2.25);if(h>hop){hop=h;hopUp=d>0}}}
 S.g.position.set(sx,(sy===null?hop:sy)+sYs,sz);S.g.visible=st!=='menu'&&!(play&&sz>11&&!sherSt);S.g.rotation.set(0,sd2*.5,sd2*.25);

 (H.tails||[]).forEach((t,i)=>{const u=t.userData,k=play?Math.min(1,speed/30):.1;t.rotation.x=u.b-k*u.lift+Math.sin(clk*u.f+i*1.7)*u.a;t.rotation.y=Math.sin(clk*16+i*2)*.1*k})}
